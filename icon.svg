<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#2a1f1a"/>
      <stop offset="100%" stop-color="#0e0c0b"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0d898"/>
      <stop offset="50%" stop-color="#e8c97e"/>
      <stop offset="100%" stop-color="#c9a96e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- Taust ümarate nurkadega ruut -->
  <rect width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>

  <!-- Subtle välimine kuldne ring -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#c9a96e" stroke-width="2" opacity="0.35"/>
  <circle cx="256" cy="256" r="184" fill="none" stroke="#c9a96e" stroke-width="1" opacity="0.2"/>

  <!-- Kuldne hõõg G all -->
  <g filter="url(#glow)" opacity="0.5">
    <path d="M 350 195
             A 140 140 0 1 0 350 317
             L 350 268
             L 268 268"
          fill="none" stroke="#e8c97e" stroke-width="56" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Peamine G täht — paks elegantne -->
  <path d="M 350 195
           A 140 140 0 1 0 350 317
           L 350 268
           L 268 268"
        fill="none" stroke="url(#gold)" stroke-width="48" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
